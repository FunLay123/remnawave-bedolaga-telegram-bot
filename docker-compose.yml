services:
  postgres:
    image: postgres:18-alpine
    container_name: remnawave_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remnawave_bot}
      POSTGRES_USER: ${POSTGRES_USER:-remnawave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    # Сторож: при пустом томе 18 и данных 15 в старом томе PostgreSQL не стартует
    # и просит выполнить `make pg-upgrade` — вместо молчаливой пустой базы.
    entrypoint: ['/bin/sh', '/usr/local/bin/pg-upgrade-guard.sh']
    command: ['postgres']
    volumes:
      # С PostgreSQL 18 образ хранит данные в /var/lib/postgresql/18/docker —
      # том монтируется в /var/lib/postgresql, а не в .../data, как раньше.
      - postgres18_data:/var/lib/postgresql
      # Том PostgreSQL 15 — только на чтение и только для сторожа. После переноса
      # (make pg-upgrade) его можно удалить; см. docs/postgresql-18-upgrade.md.
      - postgres_data:/mnt/pg-legacy-data:ro
      - ./docker/postgres/pg-upgrade-guard.sh:/usr/local/bin/pg-upgrade-guard.sh:ro
    networks:
      - bot_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-remnawave_user} -d ${POSTGRES_DB:-remnawave_bot}',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: remnawave_bot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - bot_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    container_name: remnawave_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FORCE_COLOR: '1'
      DOCKER_ENV: 'true'
      DATABASE_MODE: 'auto'
      POSTGRES_HOST: 'postgres'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: '${POSTGRES_DB:-remnawave_bot}'
      POSTGRES_USER: '${POSTGRES_USER:-remnawave_user}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-secure_password_123}'

      REDIS_URL: 'redis://redis:6379/0'

      TZ: 'Europe/Moscow'
      LOCALES_PATH: '${LOCALES_PATH:-/app/locales}'
    volumes:
      # Логи
      - ./logs:/app/logs:rw
      # Данные приложения (для SQLite в случае переключения)
      - ./data:/app/data:rw
      - ./locales:/app/locales:rw
      # Timezone
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # Загруженные медиафайлы (изображения/видео для новостей)
      - ./uploads:/app/uploads:rw
      # Логотип для сообщений
      - ./vpn_logo.png:/app/vpn_logo.png:ro
    ports:
      - '${WEB_API_BIND:-127.0.0.1}:${WEB_API_PORT:-8080}:${WEB_API_PORT:-8080}'
    networks:
      - bot_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import requests, os; requests.get(''http://localhost:'' + os.environ.get(''WEB_API_PORT'', ''8080'') + ''/health'', headers={''X-API-Key'': os.environ.get(''WEB_API_DEFAULT_TOKEN'')}, timeout=5) or exit(1)"',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  backup:
    profiles: ['backup']
    build:
      context: ./docker/backup
    container_name: remnawave_bot_backup
    restart: unless-stopped
    # Restic may be in the middle of an upload.  SIGTERM stops the loop after
    # the current operation; this grace period does not cancel an active upload.
    stop_grace_period: 2m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: '${POSTGRES_DB:-remnawave_bot}'
      PGUSER: '${POSTGRES_USER:-remnawave_user}'
      PGPASSWORD: '${POSTGRES_PASSWORD:-secure_password_123}'
      PGCONNECT_TIMEOUT: '10'
      TZ: '${TZ:-Europe/Moscow}'
      ENV_FILE: /src/.env
      BACKUP_RESTIC_STAGE_DIR: /run/remnawave-backup
      BACKUP_RESTIC_STATE_DIR: /backups/restic/state
      BACKUP_RESTIC_INTERVAL_SECONDS: '${BACKUP_RESTIC_INTERVAL_SECONDS:-300}'
      BACKUP_RESTIC_KEEP_LAST: '${BACKUP_RESTIC_KEEP_LAST:-12}'
      BACKUP_RESTIC_KEEP_HOURLY: '${BACKUP_RESTIC_KEEP_HOURLY:-24}'
      BACKUP_RESTIC_KEEP_DAILY: '${BACKUP_RESTIC_KEEP_DAILY:-30}'
      BACKUP_RESTIC_KEEP_WEEKLY: '${BACKUP_RESTIC_KEEP_WEEKLY:-12}'
      BACKUP_RESTIC_KEEP_MONTHLY: '${BACKUP_RESTIC_KEEP_MONTHLY:-12}'
      BACKUP_RESTIC_MAINTENANCE_ENABLED: '${BACKUP_RESTIC_MAINTENANCE_ENABLED:-true}'
      BACKUP_RESTIC_MAINTENANCE_TIME: '${BACKUP_RESTIC_MAINTENANCE_TIME:-03:00}'
      BACKUP_RESTIC_HEALTHCHECK_MAX_AGE_SECONDS: '${BACKUP_RESTIC_HEALTHCHECK_MAX_AGE_SECONDS:-900}'
      BACKUP_RESTIC_TMPFS_SIZE: '${BACKUP_RESTIC_TMPFS_SIZE:-256m}'
      BACKUP_RESTIC_MIN_FREE_MB: '${BACKUP_RESTIC_MIN_FREE_MB:-16}'
      BACKUP_RESTIC_REQUIRE_TMPFS: '${BACKUP_RESTIC_REQUIRE_TMPFS:-true}'
      BACKUP_COMPOSE_FILES: '${BACKUP_COMPOSE_FILES:-}'
      BACKUP_COMPOSE_PROJECT: '${COMPOSE_PROJECT_NAME:-}'
      RCLONE_TIMEOUT: '${RCLONE_TIMEOUT:-2m}'
      RCLONE_CONTIMEOUT: '${RCLONE_CONTIMEOUT:-10s}'
      RCLONE_RETRIES: '${RCLONE_RETRIES:-3}'
      RESTIC_REPOSITORY: '${BACKUP_RESTIC_REPOSITORY:-rclone:gdrive:remnawave-restic}'
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      RCLONE_CONFIG: /config/rclone/rclone.conf
      BACKUP_PING_URL_FILE: /run/secrets/ping-url
    volumes:
      # Directory mount, not a single-file bind: replacing .env on the host must
      # be visible without recreating the container.  The script reads only
      # /src/.env from this read-only mount.
      - ./:/src:ro
      # rclone writes refreshed OAuth tokens back to its dedicated config.
      - ${BACKUP_RCLONE_CONFIG_DIR:-/etc/remnawave-backup/rclone}:/config/rclone:rw
      # Password file is read-only and never part of the application .env.
      - ${BACKUP_RESTIC_PASSWORD_FILE:-/etc/remnawave-backup/restic-password}:/run/secrets/restic-password:ro
      # Optional healthchecks.io-compatible ping URL. /dev/null disables it.
      - ${BACKUP_PING_URL_FILE:-/dev/null}:/run/secrets/ping-url:ro
      # Persistent freshness/maintenance state.  Legacy backup_data contents are
      # intentionally left untouched until a verified cutover.
      - backup_data:/backups
    # Bounded staging area: a huge dump must not fill the container writable layer.
    tmpfs:
      - /run/remnawave-backup:size=${BACKUP_RESTIC_TMPFS_SIZE:-256m},mode=0700
    networks:
      - bot_network
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres18_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backup_data:
    driver: local

networks:
  bot_network:
    driver: bridge
    ipam:
      config:
        - subnet: "${BOT_NETWORK_SUBNET:-172.20.0.0/16}"
          gateway: "${BOT_NETWORK_GATEWAY:-172.20.0.1}"
    driver_opts:
      com.docker.network.driver.mtu: 1350
